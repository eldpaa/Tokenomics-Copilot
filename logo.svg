<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Space Black Gradient -->
    <radialGradient id="spaceBlack" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#121626"/>
      <stop offset="50%" stop-color="#08090F"/>
      <stop offset="100%" stop-color="#030407"/>
    </radialGradient>

    <!-- Apple Titanium Frame Border Gradient (Light source: Top-Left) -->
    <linearGradient id="appleTitaniumBorder" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#A5B4FC" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#312E81" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Top Specular Catch Hairline Gradient -->
    <linearGradient id="specularHairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Indigo & Cyan Neural Diffusion Glow -->
    <radialGradient id="neuralAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Facet Left (Catching Soft Incident Light) -->
    <linearGradient id="shieldFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2338" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#131625" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0A0B14" stop-opacity="1"/>
    </linearGradient>

    <!-- Shield Facet Right (In Slight Shadow) -->
    <linearGradient id="shieldFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16192A" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0E101B" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#06070C" stop-opacity="1"/>
    </linearGradient>

    <!-- Shield Outer Bevel Stroke -->
    <linearGradient id="shieldBevelStroke" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#312E81" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Central Neural Starburst Glow -->
    <radialGradient id="geminiCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="20%" stop-color="#E0E7FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <!-- BNB Chain Hex Ring Gradient -->
    <linearGradient id="bnbHexRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Bloom Filter -->
    <filter id="bloomSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient Backlight Blur -->
    <filter id="auraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>
  </defs>

  <!-- Layer 0: Ambient Backlight Aura -->
  <circle cx="256" cy="256" r="210" fill="url(#neuralAura)" filter="url(#auraGlow)"/>

  <!-- Layer 1: Apple Continuous Curvature Squircle Housing (G2 Superellipse Continuity) -->
  <!-- Outer space titanium shell -->
  <path d="M 256 18 
           C 375 18, 494 36, 494 155 
           C 494 274, 494 393, 375 494 
           C 256 494, 137 494, 18 375 
           C 18 256, 18 137, 137 18 
           Z" 
        fill="url(#spaceBlack)" 
        stroke="url(#appleTitaniumBorder)" 
        stroke-width="2.5"/>

  <!-- Precision Squircle Inner Inset Shadow / Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Layer 2: Emil Kowalski Top-Light Specular Catch (1px Tactile Hairline) -->
  <path d="M 120 28 C 180 21, 332 21, 392 28" 
        stroke="url(#specularHairline)" 
        stroke-width="1.75" 
        stroke-linecap="round"/>

  <!-- Layer 3: The Security Shield (Faceted Monolithic Armor) -->
  <!-- Left Shield Facet -->
  <path d="M 256 86 
           L 136 138 
           C 136 280, 192 384, 256 426 
           Z" 
        fill="url(#shieldFacetLeft)"/>

  <!-- Right Shield Facet -->
  <path d="M 256 86 
           L 376 138 
           C 376 280, 320 384, 256 426 
           Z" 
        fill="url(#shieldFacetRight)"/>

  <!-- Shield Outer Border Profile -->
  <path d="M 256 86 
           L 376 138 
           C 376 280, 320 384, 256 426 
           C 192 384, 136 280, 136 138 
           Z" 
        fill="none" 
        stroke="url(#shieldBevelStroke)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Shield Center Ridge Specular Highlight -->
  <line x1="256" y1="88" x2="256" y2="422" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Shield Inner Precision Hairline Inset -->
  <path d="M 256 112 
           L 352 154 
           C 352 268, 308 354, 256 392 
           C 204 354, 160 268, 160 154 
           Z" 
        fill="none" 
        stroke="#818CF8" 
        stroke-opacity="0.18" 
        stroke-width="1.25"/>

  <!-- Layer 4: BNB Chain & Cryptographic Security Geometry -->
  <!-- Outer Hexagonal Telemetry Lattice -->
  <polygon points="256,166 322,204 322,280 256,318 190,280 190,204" 
           fill="none" 
           stroke="url(#bnbHexRing)" 
           stroke-width="1.75" 
           stroke-dasharray="4 3" 
           stroke-opacity="0.55"/>

  <!-- Layer 5: Gemini AI Intelligence Core & Viem Telemetry Constellation -->
  <!-- Ambient Core Bloom -->
  <circle cx="256" cy="242" r="64" fill="url(#geminiCoreGlow)" filter="url(#bloomSoft)"/>

  <!-- Telemetry Interconnect Lines -->
  <g stroke="#C7D2FE" stroke-width="2" stroke-opacity="0.75">
    <line x1="256" y1="172" x2="256" y2="242" />
    <line x1="256" y1="312" x2="256" y2="242" />
    <line x1="198" y1="242" x2="256" y2="242" />
    <line x1="314" y1="242" x2="256" y2="242" />
    <line x1="215" y1="201" x2="256" y2="242" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="297" y1="201" x2="256" y2="242" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="215" y1="283" x2="256" y2="242" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="297" y1="283" x2="256" y2="242" stroke-width="1.5" stroke-opacity="0.45"/>
  </g>

  <!-- Telemetry Satellite Verification Nodes -->
  <circle cx="256" cy="172" r="5" fill="#FFFFFF" filter="url(#bloomSoft)"/>
  <circle cx="314" cy="242" r="5" fill="#38BDF8"/>
  <circle cx="256" cy="312" r="5" fill="#818CF8"/>
  <circle cx="198" cy="242" r="5" fill="#38BDF8"/>

  <!-- Diagonal Sub-Probes -->
  <circle cx="215" cy="201" r="3.5" fill="#A5B4FC" fill-opacity="0.8"/>
  <circle cx="297" cy="201" r="3.5" fill="#A5B4FC" fill-opacity="0.8"/>
  <circle cx="215" cy="283" r="3.5" fill="#A5B4FC" fill-opacity="0.8"/>
  <circle cx="297" cy="283" r="3.5" fill="#A5B4FC" fill-opacity="0.8"/>

  <!-- Center Gemini 1.5 Pro AI Singularity Star -->
  <!-- Four-Pointed Neural Star (Precision Curved) -->
  <path d="M 256 218 
           Q 256 242 280 242 
           Q 256 242 256 266 
           Q 256 242 232 242 
           Q 256 242 256 218 Z" 
        fill="#FFFFFF" 
        filter="url(#bloomSoft)"/>

  <!-- Concentric Telemetry Ripple Ring -->
  <circle cx="256" cy="242" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.5"/>
  <circle cx="256" cy="242" r="3" fill="#FFFFFF"/>
</svg>
